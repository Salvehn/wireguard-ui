name: Desktop build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install macOS packaging dependencies
        run: brew install wireguard-tools wireguard-go
      - run: npm ci
      - name: Test
        run: |
          npm test
          npm run test:release
      - name: Build macOS arm64 artifacts
        run: npm run dist:mac
      - name: Verify packaged macOS application
        shell: bash
        run: |
          codesign --verify --deep --strict "release/mac-arm64/WireGuard Desktop.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'release/mac-arm64/WireGuard Desktop.app/Contents/Info.plist')" = "$(node -p "require('./package.json').version")"
      - name: Upload macOS release artifacts
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unsigned-macos-arm64
          if-no-files-found: error
          path: |
            release/WireGuard-Desktop-arm64.dmg
            release/WireGuard-Desktop-arm64.dmg.blockmap
            release/WireGuard-Desktop-arm64.zip
            release/WireGuard-Desktop-arm64.zip.blockmap

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - name: Test
        run: |
          npm run test:win
          npm run test:release
      - name: Build Windows x64 installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Install and smoke-test the Windows system backend
        shell: pwsh
        run: |
          $key = '0123456789abcdef'
          $token = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & .\build\helper-win\install-helper.ps1 -Source (Resolve-Path .\build\helper-win) -Key $key -Token $token -UserSid $sid
          try {
            node .\scripts\smoke-windows-helper.mjs $key $token
            if ($LASTEXITCODE -ne 0) { throw "Windows helper smoke test failed with exit code $LASTEXITCODE" }
          } catch {
            & sc.exe query "WireGuardDesktopHelper-$key"
            Get-Content -LiteralPath "$env:ProgramData\WireGuardDesktop\Helper-$key\helper.log" -ErrorAction SilentlyContinue
            throw
          }
      - name: Upload Windows release artifacts
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unsigned-windows-x64
          if-no-files-found: error
          path: |
            release/WireGuard-Desktop-x64-Setup.exe
            release/WireGuard-Desktop-x64-Setup.exe.blockmap

  sign:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-unsigned-*
          path: release
          merge-multiple: true
      - name: Create signed update manifests
        env:
          UPDATE_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_PRIVATE_KEY_PEM }}
        run: |
          test -n "$UPDATE_PRIVATE_KEY_PEM"
          npm run update:manifest
          npm run update:manifest:win
      - name: Upload signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signed
          if-no-files-found: error
          path: |
            release/WireGuard-Desktop-arm64.dmg
            release/WireGuard-Desktop-arm64.dmg.blockmap
            release/WireGuard-Desktop-arm64.zip
            release/WireGuard-Desktop-arm64.zip.blockmap
            release/update-arm64.json
            release/WireGuard-Desktop-x64-Setup.exe
            release/WireGuard-Desktop-x64-Setup.exe.blockmap
            release/update-windows-x64.json

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-signed
          path: release
      - name: Publish and verify the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run publish:release
